<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atro Zar | آترو زر</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0b0b;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
            padding: 40px 20px;
        }

        .logo {
            width: 220px;
            max-width: 70%;
            height: auto;
            margin-bottom: 40px;
        }

        h1 {
            margin: 0 0 20px;
            font-size: 36px;
            font-weight: 500;
        }

        .message {
            margin: 0;
            color: #cfcfcf;
            font-size: 20px;
            line-height: 2;
        }

        .english {
            margin-top: 12px;
            color: #777;
            font-size: 14px;
            direction: ltr;
        }

        .brand {
            margin-top: 45px;
            color: #666;
            font-size: 13px;
            letter-spacing: 2px;
            direction: ltr;
        }
    </style>
</head>

<body>

    <main class="container">

        <img src="atrozar-logo.jpg"
             alt="Atro Zar"
             class="logo">

        <h1>آترو زر</h1>

        <p class="message">
            وب‌ سایت آترو زر در حال آماده‌ سازی است.
            <br>
            به‌ زودی با شما خواهیم بود.
        </p>

        <p class="english">
            Our website is currently under construction.
        </p>

        <div class="brand">
            ATRO ZAR • GOLD GALLERY
        </div>

    </main>

</body>
</html>
